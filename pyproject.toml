[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-steering-certificates"
version = "1.0.0"
description = "Exact-Q finite-setting steering gap laws, rational polytope certificates, and machine-checked two-copy superactivation of PVM-critical two-qubit states"
authors = [{ name = "Lluis Eriksson" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
